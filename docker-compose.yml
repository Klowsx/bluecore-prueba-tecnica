services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bluecore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bluecore_local}
      POSTGRES_DB: ${POSTGRES_DB:-bluecore}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-bluecore}:${POSTGRES_PASSWORD:-bluecore_local}@db:5432/${POSTGRES_DB:-bluecore}?schema=public
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "4200:4200"

volumes:
  postgres_data:
